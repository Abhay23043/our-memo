<!doctype html>
<html lang="en">

<head>

    <!-- =====================================================
         BASIC META
    ====================================================== -->

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <meta
        name="theme-color"
        content="#ffffff"
    />


    <!-- =====================================================
         TITLE
    ====================================================== -->

    <title>
        Our Memo - Save Your Precious Memories
    </title>


    <!-- =====================================================
         SEO DESCRIPTION
    ====================================================== -->

    <meta
        name="description"
        content="Our Memo is a private digital memory platform to save, organize and manage your precious photos and memories in one secure place."
    />


    <!-- =====================================================
         KEYWORDS
    ====================================================== -->

    <meta
        name="keywords"
        content="Our Memo, OurMemo, digital memories, memory storage, photo memories, save memories, private photo gallery, online photo gallery, personal memories, photo organizer, memory management"
    />


    <!-- =====================================================
         AUTHOR
    ====================================================== -->

    <meta
        name="author"
        content="Abhay Jaiswal"
    />


    <meta
        name="creator"
        content="Abhay Jaiswal"
    />


    <meta
        name="publisher"
        content="Our Memo"
    />


    <!-- =====================================================
         SEARCH ENGINE
    ====================================================== -->

    <meta
        name="robots"
        content="index, follow"
    />


    <meta
        name="googlebot"
        content="index, follow"
    />


    <!-- =====================================================
         CANONICAL URL
    ====================================================== -->

    <link
        rel="canonical"
        href="https://ourmemo.vercel.app/"
    />


    <!-- =====================================================
         FAVICON
    ====================================================== -->

    <link
        rel="icon"
        type="image/svg+xml"
        href="/favicon.svg"
    />


    <!-- =====================================================
         OPEN GRAPH
         For WhatsApp / Facebook / LinkedIn sharing
    ====================================================== -->

    <meta
        property="og:type"
        content="website"
    />


    <meta
        property="og:title"
        content="Our Memo - Save Your Precious Memories"
    />


    <meta
        property="og:description"
        content="A private digital space to save, organize and manage your precious memories and photos."
    />


    <meta
        property="og:url"
        content="https://ourmemo.vercel.app/"
    />


    <meta
        property="og:site_name"
        content="Our Memo"
    />


    <meta
        property="og:locale"
        content="en_US"
    />


    <!-- =====================================================
         TWITTER / X
    ====================================================== -->

    <meta
        name="twitter:card"
        content="summary"
    />


    <meta
        name="twitter:title"
        content="Our Memo - Save Your Precious Memories"
    />


    <meta
        name="twitter:description"
        content="Save, organize and manage your precious memories in one private digital space."
    />

        "creator": {

        },

            "@type": "Person",
